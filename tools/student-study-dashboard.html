<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Dashboard | AXORIUM</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Specific layout for the dashboard to keep it premium and neat */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }
        .timer-display {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-gold);
            margin: 20px 0;
            letter-spacing: 2px;
        }
        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
            border-left: 3px solid var(--primary-gold);
            text-align: left;
        }
        .quote-box {
            font-style: italic;
            color: var(--text-muted);
            margin-top: 40px;
            padding: 20px;
            border-top: 1px solid var(--border-light);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">AXORIUM</div>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../tools.html">Tools</a></li>
        </ul>
    </nav>

    <section class="tools-section">
        <h1>Student Study Dashboard</h1>
        <p>Your professional study planner, Pomodoro timer, and task manager.</p>

        <div class="dashboard-grid">
            
            <!-- EXAM GOAL SECTION -->
            <div class="tool-card">
                <h2>Target Exam Goal</h2>
                <input type="text" id="examName" class="tool-input" placeholder="Exam Name (e.g., Final Exams)">
                <input type="date" id="examDate" class="tool-input">
                <input type="number" id="studyHours" class="tool-input" placeholder="Daily Study Target (Hours)">
                <button onclick="setGoal()" style="width: 100%; margin-top: 10px;">Lock In Goal</button>
                <div id="goalResult" style="margin-top: 15px; font-weight: 700; color: var(--primary-gold); font-size: 1.2rem;"></div>
            </div>

            <!-- TIMER SECTION -->
            <div class="tool-card">
                <h2>Focus Timer</h2>
                <div id="countdown" style="color: var(--text-muted); font-weight: 600;">Stay relentless!</div>
                <div class="timer-display" id="timer">25:00</div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="resetTimer()">Reset</button>
                </div>
            </div>

            <!-- TASK MANAGER SECTION -->
            <div class="tool-card" style="grid-column: 1 / -1;">
                <h2>Task Manager</h2>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="taskInput" class="tool-input" placeholder="What exactly do you need to master today?">
                    <button onclick="addTask()">Add Task</button>
                </div>
                <div id="taskList"></div>
            </div>

        </div>

        <div class="quote-box">
            "<span id="quote">Loading fuel...</span>"
        </div>

    </section>

    <footer>© 2026 AXORIUM. Built for the Relentless.</footer>

    <script>
        /* EXAM GOAL LOGIC */
        function setGoal(){
            let exam = document.getElementById("examName").value;
            let date = document.getElementById("examDate").value;
            let hours = document.getElementById("studyHours").value;

            if(!exam || !date || !hours) {
                alert("Do not leave blanks. Fill all fields to set your goal.");
                return;
            }

            let today = new Date();
            let examDate = new Date(date);
            let diff = Math.ceil((examDate - today) / (1000 * 60 * 60 * 24));

            if (diff < 0) {
                alert("That date has already passed!");
                return;
            }

            document.getElementById("goalResult").innerHTML = exam + " is in " + diff + " days.<br>Target: " + hours + " hours/day";
            document.getElementById("countdown").innerHTML = "Grinding for: " + exam;
        }

        /* TASK MANAGER LOGIC */
        function addTask(){
            let input = document.getElementById("taskInput");
            let task = input.value;

            if(task.trim() === "") return;

            let div = document.createElement("div");
            div.className = "task";
            div.innerHTML = "<span>" + task + "</span>" +
                            "<button onclick='this.parentElement.remove()' style='padding: 5px 15px; font-size: 0.8rem;'>Done</button>";

            document.getElementById("taskList").appendChild(div);
            input.value = "";
        }

        /* POMODORO TIMER LOGIC */
        let time = 1500; // 25 minutes in seconds
        let interval;

        function updateTimer(){
            let minutes = Math.floor(time / 60);
            let seconds = time % 60;
            document.getElementById("timer").innerText = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }

        function startTimer(){
            if(interval) return;
            interval = setInterval(() => {
                time--;
                updateTimer();
                if(time <= 0){
                    clearInterval(interval);
                    interval = null;
                    alert("Focus session complete! Step away and take a 5-minute break.");
                    time = 1500; // Reset for the next grind
                    updateTimer();
                }
            }, 1000);
        }

        function pauseTimer(){
            clearInterval(interval);
            interval = null;
        }

        function resetTimer(){
            pauseTimer();
            time = 1500;
            updateTimer();
        }

        updateTimer();

        /* MOTIVATION GENERATOR */
        const quotes = [
            "Discipline beats motivation every single time.",
            "Focus on progress, not perfection.",
            "Your future is built by what you do today.",
            "Success comes from relentless, consistent effort.",
            "Average is a failing formula. Keep pushing."
        ];
        document.getElementById("quote").innerText = quotes[Math.floor(Math.random() * quotes.length)];
    </script>
</body>
</html>
